title: watr
description: Spec-complete wat2wasm implementation in JavaScript. Compiles WebAssembly text (WAT) to wasm binary with no dependencies and no Emscripten.
url: https://watr.js.org
baseurl: ""

# code fences render as plain <pre><code class="language-*"> — hl.js paints them
kramdown:
  syntax_highlighter_opts:
    disable: true

# underscore-prefixed files are skipped by default; the playground fetches this one
include:
  - test/lib/_wast.cjs

exclude:
  - node_modules
  - test/official
  - test/repl
  - types
  - bin
  - play/test-results
  - playwright.config.js
  - package-lock.json
  - tea.yaml
